<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal Kehadiran QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader { border: none !important; width: 100% !important; }
    #reader video { border-radius: 1rem; object-fit: cover; width: 100% !important; height: 100% !important; }
    #reader__scan_region { background: transparent !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-base shadow-lg shadow-indigo-500/20">
          QR
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-wide text-white">Smart Attendance</h1>
          <p class="text-[11px] text-slate-400">Terminal Pengimbas GitHub</p>
        </div>
      </div>
      <div class="text-right">
        <div id="liveClock" class="text-sm font-mono font-bold text-indigo-400">00:00:00</div>
        <div id="liveDate" class="text-[10px] text-slate-400">Memuatkan...</div>
      </div>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center">
    
    <div class="bg-slate-900 p-1.5 rounded-2xl flex space-x-1.5 border border-slate-800 mb-4 shadow-inner">
      <button id="btnIn" onclick="setMode('Clock In')" class="flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm bg-emerald-600 text-white shadow-lg shadow-emerald-600/30">
        🟢 Clock In (Masuk)
      </button>
      <button id="btnOut" onclick="setMode('Clock Out')" class="flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm text-slate-400 hover:text-white">
        🔴 Clock Out (Keluar)
      </button>
    </div>

    <div class="bg-slate-900/50 rounded-3xl p-4 border border-slate-800/80 shadow-2xl relative">
      <div class="relative overflow-hidden rounded-2xl bg-black/40 border border-slate-800 aspect-square max-h-[320px] mx-auto flex items-center justify-center">
        <div id="reader"></div>
      </div>

      <div id="statusBox" class="mt-4 p-3.5 rounded-xl border border-slate-800 bg-slate-900/90 text-center">
        <p id="statusMsg" class="text-xs font-medium text-slate-400">Memulakan kamera...</p>
      </div>
    </div>

  </main>

  <footer class="text-center py-3 border-t border-slate-900 text-[11px] text-slate-600">
    Hos GitHub Pages &bull; Google Sheets API
  </footer>

  <script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const SCRIPT_URL = "URL_WEB_APP_GOOGLE_SCRIPT_ANDA";

    let currentMode = 'Clock In';
    let isProcessing = false;
    let html5QrCode = null;

    function playBeep(success = true) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(success ? 880 : 220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + (success ? 0.12 : 0.25));
      } catch (e) {}
    }

    function setMode(mode) {
      currentMode = mode;
      const btnIn = document.getElementById('btnIn');
      const btnOut = document.getElementById('btnOut');
      if (mode === 'Clock In') {
        btnIn.className = "flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm bg-emerald-600 text-white shadow-lg shadow-emerald-600/30";
        btnOut.className = "flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm text-slate-400 hover:text-white";
      } else {
        btnOut.className = "flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm bg-rose-600 text-white shadow-lg shadow-rose-600/30";
        btnIn.className = "flex-1 py-2.5 rounded-xl font-medium text-xs sm:text-sm text-slate-400 hover:text-white";
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('ms-MY', { hour12: true });
      document.getElementById('liveDate').innerText = now.toLocaleDateString('ms-MY', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const statusBox = document.getElementById('statusBox');
      const statusMsg = document.getElementById('statusMsg');

      statusBox.className = "mt-4 p-3.5 rounded-xl border border-indigo-500/40 bg-indigo-500/10 text-center animate-pulse";
      statusMsg.innerHTML = `<span class="text-indigo-400 font-medium text-xs">Memproses imbasan: ${decodedText}...</span>`;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Mengelakkan isu Preflight CORS
          body: JSON.stringify({ qrData: decodedText, type: currentMode })
        });
        
        const data = await response.json();

        if (data.status === "success") {
          playBeep(true);
          statusBox.className = "mt-4 p-3.5 rounded-xl border border-emerald-500/50 bg-emerald-500/10 text-center";
          statusMsg.innerHTML = `
            <div class="text-emerald-400 font-bold text-sm">Imbasan Berjaya!</div>
            <div class="text-slate-100 font-semibold text-xs mt-0.5">${data.name}</div>
            <div class="text-slate-400 text-[11px] mt-1">ID: <span class="font-mono text-indigo-300">${data.id}</span> &bull; ${data.type} (${data.time})</div>
          `;
        } else {
          playBeep(false);
          statusBox.className = "mt-4 p-3.5 rounded-xl border border-rose-500/50 bg-rose-500/10 text-center";
          statusMsg.innerHTML = `<span class="text-rose-400 font-semibold text-xs">Ralat: ${data.message}</span>`;
        }
      } catch (err) {
        playBeep(false);
        statusBox.className = "mt-4 p-3.5 rounded-xl border border-rose-500/50 bg-rose-500/10 text-center";
        statusMsg.innerHTML = `<span class="text-rose-400 font-semibold text-xs">Ralat Sambungan API: ${err.message}</span>`;
      }

      setTimeout(() => {
        statusBox.className = "mt-4 p-3.5 rounded-xl border border-slate-800 bg-slate-900/90 text-center";
        statusMsg.innerHTML = `<span class="text-slate-400 text-xs font-medium">Halakan kod QR staf pada petak kamera</span>`;
        isProcessing = false;
      }, 3000);
    }

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {})
        .then(() => {
          document.getElementById('statusMsg').innerText = "Halakan kod QR staf pada petak kamera";
        })
        .catch(err => {
          document.getElementById('statusBox').className = "mt-4 p-3.5 rounded-xl border border-rose-500/50 bg-rose-500/10 text-center";
          document.getElementById('statusMsg').innerHTML = `<span class="text-rose-400 font-semibold text-xs">Kamera tidak dapat diakses. Sila pastikan kebenaran kamera diberikan.</span>`;
        });
    }

    window.onload = startCamera;
  </script>
</body>
</html>
